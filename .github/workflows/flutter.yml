name: Flutter checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android runner when absent
        shell: bash
        run: |
          if [ ! -d android ]; then
            temp_dir="$(mktemp -d)"
            flutter create --project-name stashhive --platforms=android "$temp_dir/stashhive"
            cp -R "$temp_dir/stashhive/android" ./android
            if [ ! -f .metadata ]; then
              cp "$temp_dir/stashhive/.metadata" ./.metadata
            fi
            rm -rf "$temp_dir"
          fi

      - name: Resolve packages
        run: flutter pub get

      - name: Format Dart sources
        run: dart format lib test

      - name: Static analysis
        run: flutter analyze

      - name: Unit tests
        run: flutter test --reporter expanded

      - name: Build web release
        run: flutter build web --release

      - name: Build Android debug APK
        run: flutter build apk --debug
