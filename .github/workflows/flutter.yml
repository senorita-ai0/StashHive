name: Manual Flutter validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android runner when absent
        shell: bash
        run: |
          if [ ! -d android ]; then
            temp_dir="$(mktemp -d)"
            flutter create --project-name stashhive --platforms=android "$temp_dir/stashhive"
            cp -R "$temp_dir/stashhive/android" ./android
            if [ ! -f .metadata ]; then
              cp "$temp_dir/stashhive/.metadata" ./.metadata
            fi
            rm -rf "$temp_dir"
          fi

      - name: Register Android incoming share targets
        run: python3 tool/configure_android_share_intents.py

      - name: Test Android share manifest configurator
        run: python3 -m unittest tool.test_configure_android_share_intents

      - name: Resolve packages
        run: flutter pub get

      - name: Format Dart sources
        run: dart format lib test

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Unit tests
        run: flutter test --reporter expanded

      - name: Build web release
        run: flutter build web --release

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stashhive-manual-builds
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/web/
          if-no-files-found: error
          retention-days: 14
