name: stashhive
description: A local-first personal library for saving and finding links, notes, images and documents.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^11.0.3
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  share_plus: ^12.0.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
