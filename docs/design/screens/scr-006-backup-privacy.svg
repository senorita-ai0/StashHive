<svg xmlns="http://www.w3.org/2000/svg" width="432" height="936" viewBox="0 0 432 936"><title>SCR-006 · Backup &amp; Privacy</title><defs><linearGradient id="im" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#D6E7FD"/><stop offset="1" stop-color="#A9E1D7"/></linearGradient><linearGradient id="im2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FBE7D1"/><stop offset="1" stop-color="#EAF2FF"/></linearGradient></defs><rect x="0" y="0" width="432" height="936" rx="0" fill="#F6F8FC" /><text x="26" y="23" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="650" fill="#10203A" text-anchor="start">9:41</text><circle cx="357" cy="17" r="2.5" fill="#10203A"/><rect x="365" y="14" width="3" height="7" rx="1" fill="#10203A"/><rect x="370" y="11" width="3" height="10" rx="1" fill="#10203A"/><rect x="375" y="8" width="3" height="13" rx="1" fill="#10203A"/><rect x="388" y="11" width="16" height="10" rx="2" fill="none" stroke="#10203A" stroke-width="1.4"/><rect x="404" y="14" width="2" height="4" rx="1" fill="#10203A"/><rect x="390" y="13" width="10" height="6" rx="1" fill="#10203A"/><text x="26" y="72" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="400" fill="#10203A" text-anchor="start">‹</text><text x="61" y="68" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="650" fill="#10203A" text-anchor="start">Backup &amp; privacy</text><text x="24" y="119" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="750" fill="#10203A" text-anchor="start">Your library,</text><text x="24" y="151" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="750" fill="#10203A" text-anchor="start">in your control.</text><text x="24" y="180" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#65738B" text-anchor="start">Keep a safe copy you can restore later.</text><rect x="22" y="204" width="388" height="90" rx="16" fill="#FFFFFF" stroke="#E3E8F0" stroke-width="1"/><rect x="36" y="221" width="50" height="50" rx="15" fill="#E7F7EF" /><text x="61" y="253" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#16A34A" text-anchor="middle">✓</text><text x="101" y="234" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#10203A" text-anchor="start">Stored on this device</text><text x="101" y="256" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#65738B" text-anchor="start">Your saved library stays local by default.</text><rect x="315" y="232" width="75" height="25" rx="12.5" fill="#E7F7EF" /><text x="352.5" y="248.5" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="600" fill="#16A34A" text-anchor="middle">LOCAL</text><text x="24" y="327" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#10203A" text-anchor="start">Backup</text><text x="24" y="348" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#65738B" text-anchor="start">Export your items and copied attachments to a file.</text><rect x="22" y="363" width="388" height="153" rx="16" fill="#FFFFFF" stroke="#E3E8F0" stroke-width="1"/><rect x="37" y="379" width="48" height="48" rx="14" fill="#EAF2FF" /><text x="61" y="409" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#2563EB" text-anchor="middle">↓</text><text x="100" y="393" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#10203A" text-anchor="start">Create a backup</text><text x="100" y="415" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#65738B" text-anchor="start">Portable, versioned archive</text><rect x="300" y="388" width="87" height="24" rx="12" fill="#FFF2DF" /><text x="343.5" y="404" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="600" fill="#D97706" text-anchor="middle">NOT YET</text><path d="M38 440L394 440" stroke="#E3E8F0" stroke-width="1" fill="none" stroke-linecap="round"/><text x="38" y="463" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#65738B" text-anchor="start">Last backup prepared</text><text x="394" y="463" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="600" fill="#10203A" text-anchor="end">Not prepared yet</text><rect x="38" y="477" width="356" height="40" rx="13" fill="#2563EB" /><text x="216" y="502" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="650" fill="#FFFFFF" text-anchor="middle">Create backup</text><text x="24" y="553" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#10203A" text-anchor="start">Restore</text><text x="24" y="574" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#65738B" text-anchor="start">Bring a previous StashTrail or StashHive backup into this library.</text><rect x="22" y="589" width="388" height="101" rx="16" fill="#FFFFFF" stroke="#E3E8F0" stroke-width="1"/><rect x="37" y="605" width="48" height="48" rx="14" fill="#EAF2FF" /><text x="61" y="635" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#3673BE" text-anchor="middle">↑</text><text x="100" y="619" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#10203A" text-anchor="start">Restore from backup</text><text x="100" y="641" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#65738B" text-anchor="start">Choose a .stashhive backup file.</text><text x="100" y="665" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="400" fill="#65738B" text-anchor="start">Your current data will be protected.</text><text x="385" y="642" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="450" fill="#9AAAC0" text-anchor="middle">›</text><rect x="22" y="711" width="388" height="122" rx="16" fill="#FFF2DF" /><text x="38" y="738" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#D97706" text-anchor="start">Before you continue</text><text x="38" y="762" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#10203A" text-anchor="start">Uninstalling the app or clearing browser data can</text><text x="38" y="780" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#10203A" text-anchor="start">erase your local library. Keep backups somewhere</text><text x="38" y="798" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#10203A" text-anchor="start">safe. StashHive does not sync to the cloud.</text><text x="38" y="819" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="650" fill="#2563EB" text-anchor="start">What is included in a backup?  →</text></svg>